version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: plugg-postgres
    environment:
      POSTGRES_USER: plugg
      POSTGRES_PASSWORD: plugg123
      POSTGRES_DB: plugg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugg -d plugg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
