<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- PLUGG Logo - Power Plug + Location Pin Fusion -->
  <defs>
    <linearGradient id="plugGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B00"/>
      <stop offset="100%" style="stop-color:#FF9500"/>
    </linearGradient>
  </defs>
  
  <!-- Icon: Power Plug + Location Pin -->
  <g transform="translate(10, 5)">
    <!-- Location Pin Shape -->
    <path d="M20 0C8.954 0 0 8.954 0 20c0 11.046 20 35 20 35s20-23.954 20-35C40 8.954 31.046 0 20 0z" 
          fill="url(#pinGradient)"/>
    
    <!-- Inner Circle (Plug Head) -->
    <circle cx="20" cy="18" r="12" fill="white"/>
    
    <!-- Plug Prongs -->
    <rect x="14" y="6" width="3" height="8" rx="1" fill="#333"/>
    <rect x="23" y="6" width="3" height="8" rx="1" fill="#333"/>
    
    <!-- Plug Body -->
    <rect x="12" y="14" width="16" height="12" rx="2" fill="url(#plugGradient)"/>
    
    <!-- Power Symbol -->
    <circle cx="20" cy="20" r="4" fill="white"/>
    <path d="M20 16v4" stroke="#0066FF" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text: PLUGG -->
  <g transform="translate(60, 15)">
    <text x="0" y="28" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#1a1a2e">
      PLUGG
    </text>
    <!-- Tagline -->
    <text x="0" y="42" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#666" letter-spacing="2">
      HYPERLOCAL ELECTRONICS
    </text>
  </g>
</svg>
